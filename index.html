<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <div class="contain">
        <div class="in-cont" id="display"></div>
        <div class="history" id="history" title="Last calculation"></div>

        <div class="btns">
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('/')">/</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('*')">*</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('-')">-</button>

            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="press('+')">+</button>
            
            
             <button onclick="press('%')">%</button>
             <button onclick="sqr('^')">^</button>
             <button onclick=""></button>
           
             <button onclick="removeChar()" class="triangle">x</button>

             <button onclick="clearDisplay()" class="clear-btn">CLEAR</button>



        </div>
    </div>

    <script src="js/script.js"></script>


</body>
</html>
